<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Painel - Pet Show</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .painel { max-width: 560px; margin: 30px auto; padding: 0 16px; }
    .painel input { display: block; width: 100%; box-sizing: border-box; padding: 12px; margin: 10px 0; border: 1px solid #ccc; border-radius: 10px; font-size: 16px; }
    .painel button { padding: 12px 16px; border: none; border-radius: 10px; background: #6e1cb1; color: #fff; font-size: 15px; font-weight: 700; cursor: pointer; }
    .painel .erro { color: #c0392b; min-height: 20px; }
    .painel-topo { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
    .ag-card { border: 1px solid #ddd; border-radius: 12px; padding: 14px; margin: 12px 0; }
    .ag-card h3 { margin: 0 0 8px; color: #6e1cb1; }
    .ag-card p { margin: 4px 0; }
    .ag-acoes { display: flex; gap: 10px; margin-top: 10px; flex-wrap: wrap; align-items: center; }
    .ag-acoes a { color: #6e1cb1; font-weight: 700; }
    .ag-acoes button { background: #c0392b; padding: 8px 12px; }
  </style>
</head>
<body>
  <main class="painel">
    <h1>🐾 Painel de Agendamentos</h1>

    <div id="tela-login">
      <input type="email" id="email" placeholder="E-mail">
      <input type="password" id="senha" placeholder="Senha">
      <button type="button" id="btn-entrar">Entrar</button>
      <p class="erro" id="erro-login"></p>
    </div>

    <div id="tela-lista" hidden>
      <div class="painel-topo">
        <span id="total"></span>
        <button type="button" id="btn-sair">Sair</button>
      </div>
      <div id="lista"></div>
    </div>
  </main>

  <script src="supabase-config.js"></script>
  <script src="admin.js"></script>
</body>
</html>
